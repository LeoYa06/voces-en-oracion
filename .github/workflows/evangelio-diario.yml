name: Actualizar Evangelio diario
on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar Evangelio
        run: python scripts/update_gospel.py
      - name: Compilar aplicación
        run: |
          npm install
          npm run build
      - name: Publicar en la raíz para GitHub Pages
        run: |
          cp -R dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets logo-voces.png evangelio.json
          git diff --cached --quiet || git commit -m "Actualizar Evangelio diario"
          git push
